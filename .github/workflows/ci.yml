name: CI

on:
  push:
    branches: ["main", "develop", "Ritesh/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            goal: test-compile
          - service: identity-service
            goal: test-compile
          - service: api-gateway
            goal: test
          - service: rfq-service
            goal: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      - name: Run Maven verification
        working-directory: backend/${{ matrix.service }}
        run: chmod +x mvnw && ./mvnw -B ${{ matrix.goal }}

  frontend:
    name: Frontend Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
