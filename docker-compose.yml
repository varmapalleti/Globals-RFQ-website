services:
  mysql:
    image: mysql:8.4
    container_name: globalrfq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/infrastructure/database/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  eureka-server:
    image: ${GLOBALRFQ_REGISTRY:-globalrfq}/eureka-server:${GLOBALRFQ_TAG:-1.0.0}
    build:
      context: ./backend/eureka-server
    container_name: globalrfq-eureka
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8761
      MANAGEMENT_PORT: 8762
      EUREKA_HOSTNAME: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-local-eureka-password-change-me}
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8762/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  identity-service:
    image: ${GLOBALRFQ_REGISTRY:-globalrfq}/identity-service:${GLOBALRFQ_TAG:-1.0.0}
    build:
      context: ./backend/identity-service
    container_name: globalrfq-identity
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/globalrfq_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-globalrfq_app}
      DB_PASSWORD: ${DB_PASSWORD:-globalrfq_dev_password}
      JWT_SECRET: ${JWT_SECRET:-c29tZS1sb25nLWRldi1vbmx5LWJhc2U2NC1qd3Qtc2VjcmV0LWZvci1sb2NhbC1kb2NrZXI=}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@globalrfq.local}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe@2026!}
      GATEWAY_SECRET_ENABLED: "true"
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-dev-gateway-shared-secret-minimum-32-chars!}
      IDENTITY_INTERNAL_SHARED_SECRET: ${IDENTITY_INTERNAL_SHARED_SECRET:-dev-internal-identity-secret-min-32-chars!}
      OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY:-dev-outbox-encryption-key-min-32-chars!!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${VITE_FRONTEND_URL:-http://localhost:5173}}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-${VITE_FRONTEND_URL:-http://localhost:5173}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@globalrfq.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Global RFQ}
      MAIL_REPLY_TO_ADDRESS: ${MAIL_REPLY_TO_ADDRESS:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      LOG_SENSITIVE_IN_MOCK: ${LOG_SENSITIVE_IN_MOCK:-true}
      EUREKA_INSTANCE_HOSTNAME: identity-service
      EUREKA_SERVER_URL: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-local-eureka-password-change-me}@eureka-server:8761/eureka/
    ports:
      - "${IDENTITY_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 35s

  rfq-service:
    image: ${GLOBALRFQ_REGISTRY:-globalrfq}/rfq-service:${GLOBALRFQ_TAG:-1.0.0}
    build:
      context: ./backend/rfq-service
    container_name: globalrfq-rfq
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8082
      RFQ_DB_URL: jdbc:mysql://mysql:3306/global_rfq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RFQ_DB_USERNAME: ${RFQ_DB_USERNAME:-globalrfq_app}
      RFQ_DB_PASSWORD: ${RFQ_DB_PASSWORD:-globalrfq_dev_password}
      GATEWAY_SECRET_ENABLED: "true"
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-dev-gateway-shared-secret-minimum-32-chars!}
      IDENTITY_INTERNAL_SHARED_SECRET: ${IDENTITY_INTERNAL_SHARED_SECRET:-dev-internal-identity-secret-min-32-chars!}
      RFQ_ATTACHMENT_SCANNER_TOKEN: ${RFQ_ATTACHMENT_SCANNER_TOKEN:-dev-scanner-token-minimum-32-characters!}
      RFQ_STORAGE_PROVIDER: ${RFQ_STORAGE_PROVIDER:-local}
      RFQ_STORAGE_DIR: /app/data/rfq-files
      RFQ_DEFAULT_TIME_ZONE: ${RFQ_DEFAULT_TIME_ZONE:-Asia/Kolkata}
      EUREKA_INSTANCE_HOSTNAME: rfq-service
      EUREKA_SERVER_URL: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-local-eureka-password-change-me}@eureka-server:8761/eureka/
    ports:
      - "${RFQ_HOST_PORT:-8082}:8082"
    volumes:
      - rfq_files:/app/data/rfq-files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 35s

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.5}
    container_name: globalrfq-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_signatures:/var/lib/clamav

  attachment-scanner:
    image: ${GLOBALRFQ_REGISTRY:-globalrfq}/attachment-scanner:${GLOBALRFQ_TAG:-1.0.0}
    build:
      context: ./backend/rfq-scanner
    container_name: globalrfq-attachment-scanner
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
      rfq-service:
        condition: service_healthy
    environment:
      RFQ_SCANNER_BASE_URL: http://rfq-service:8082
      RFQ_ATTACHMENT_SCANNER_TOKEN: ${RFQ_ATTACHMENT_SCANNER_TOKEN:-dev-scanner-token-minimum-32-characters!}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SCAN_POLL_INTERVAL_SECONDS: ${SCAN_POLL_INTERVAL_SECONDS:-5}

  api-gateway:
    image: ${GLOBALRFQ_REGISTRY:-globalrfq}/api-gateway:${GLOBALRFQ_TAG:-1.0.0}
    build:
      context: ./backend/api-gateway
    container_name: globalrfq-gateway
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      rfq-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 9080
      GATEWAY_SECRET_ENABLED: "true"
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-dev-gateway-shared-secret-minimum-32-chars!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${VITE_FRONTEND_URL:-http://localhost:5173}}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      AUTH_RATE_LIMIT_REPLENISH_RATE: ${AUTH_RATE_LIMIT_REPLENISH_RATE:-10}
      AUTH_RATE_LIMIT_BURST_CAPACITY: ${AUTH_RATE_LIMIT_BURST_CAPACITY:-20}
      IDENTITY_RATE_LIMIT_REPLENISH_RATE: ${IDENTITY_RATE_LIMIT_REPLENISH_RATE:-60}
      IDENTITY_RATE_LIMIT_BURST_CAPACITY: ${IDENTITY_RATE_LIMIT_BURST_CAPACITY:-120}
      RFQ_RATE_LIMIT_REPLENISH_RATE: ${RFQ_RATE_LIMIT_REPLENISH_RATE:-120}
      RFQ_RATE_LIMIT_BURST_CAPACITY: ${RFQ_RATE_LIMIT_BURST_CAPACITY:-240}
      IDENTITY_REQUEST_MAX_SIZE: ${IDENTITY_REQUEST_MAX_SIZE:-1MB}
      RFQ_REQUEST_MAX_SIZE: ${RFQ_REQUEST_MAX_SIZE:-30MB}
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_SERVER_URL: http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-local-eureka-password-change-me}@eureka-server:8761/eureka/
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    image: ${GLOBALRFQ_REGISTRY:-globalrfq}/frontend:${GLOBALRFQ_TAG:-1.0.0}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:5173}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    container_name: globalrfq-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
  rfq_files:
  clamav_signatures:
