server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    loadbalancer:
      cache:
        ttl: ${LOADBALANCER_CACHE_TTL:5s}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:5000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:20s}
          default-filters:
            - RemoveResponseHeader=Server
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_UNIQUE
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowedHeaders: Authorization,Content-Type,Idempotency-Key,X-Correlation-Id
                exposedHeaders: X-Correlation-Id
                allowCredentials: true
                maxAge: 1800
          routes:
            - id: identity-sensitive-auth
              order: -10
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/login,/api/auth/refresh,/api/auth/forgot-password,/api/auth/verify-reset-otp,/api/auth/reset-password,/api/auth/verify-email,/api/auth/resend-verification,/api/auth/accept-invite
              filters:
                - name: CircuitBreaker
                  args:
                    name: identityService
                    fallbackUri: forward:/fallback/identity
                - name: RequestSize
                  args:
                    maxSize: ${IDENTITY_REQUEST_MAX_SIZE:1MB}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    deny-empty-key: true
                    empty-key-status-code: TOO_MANY_REQUESTS
                    in-memory-rate-limiter.replenishRate: ${IDENTITY_RATE_LIMIT_REPLENISH_RATE:60}
                    in-memory-rate-limiter.burstCapacity: ${IDENTITY_RATE_LIMIT_BURST_CAPACITY:120}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    deny-empty-key: true
                    empty-key-status-code: TOO_MANY_REQUESTS
                    in-memory-rate-limiter.replenishRate: ${AUTH_RATE_LIMIT_REPLENISH_RATE:10}
                    in-memory-rate-limiter.burstCapacity: ${AUTH_RATE_LIMIT_BURST_CAPACITY:20}
            - id: identity-api
              order: 0
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/audit-logs/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: identityService
                    fallbackUri: forward:/fallback/identity
                - name: RequestSize
                  args:
                    maxSize: ${IDENTITY_REQUEST_MAX_SIZE:1MB}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    deny-empty-key: true
                    empty-key-status-code: TOO_MANY_REQUESTS
                    in-memory-rate-limiter.replenishRate: ${IDENTITY_RATE_LIMIT_REPLENISH_RATE:60}
                    in-memory-rate-limiter.burstCapacity: ${IDENTITY_RATE_LIMIT_BURST_CAPACITY:120}
            - id: rfq-api
              order: 0
              uri: lb://rfq-service
              predicates:
                - Path=/api/rfqs/**,/api/quotations/**,/api/quotation-versions/**,/api/admin/rfq-rules/**,/api/reports/**,/api/red-flags/**,/api/purchases/**,/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: rfqService
                    fallbackUri: forward:/fallback/rfq
                - name: RequestSize
                  args:
                    maxSize: ${RFQ_REQUEST_MAX_SIZE:30MB}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    deny-empty-key: true
                    empty-key-status-code: TOO_MANY_REQUESTS
                    in-memory-rate-limiter.replenishRate: ${RFQ_RATE_LIMIT_REPLENISH_RATE:120}
                    in-memory-rate-limiter.burstCapacity: ${RFQ_RATE_LIMIT_BURST_CAPACITY:240}

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SERVER_URL:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka}@localhost:8761/eureka/}"
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL:5}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:localhost}:${server.port}

management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

app:
  gateway:
    secret-enabled: ${GATEWAY_SECRET_ENABLED:true}
    shared-secret: ${GATEWAY_SHARED_SECRET:}
    header-name: X-Gateway-Secret
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
    auth-rate-limit:
      replenish-rate: ${AUTH_RATE_LIMIT_REPLENISH_RATE:10}
      burst-capacity: ${AUTH_RATE_LIMIT_BURST_CAPACITY:20}

resilience4j:
  circuitbreaker:
    instances:
      identityService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallDurationThreshold: ${CB_SLOW_CALL_DURATION:5s}
        slowCallRateThreshold: 80
        waitDurationInOpenState: ${CB_WAIT_DURATION_OPEN:5s}
        permittedNumberOfCallsInHalfOpenState: 3
      rfqService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallDurationThreshold: ${CB_SLOW_CALL_DURATION:5s}
        slowCallRateThreshold: 80
        waitDurationInOpenState: ${CB_WAIT_DURATION_OPEN:5s}
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  level:
    root: INFO
    com.globalrfq.gateway: INFO
