spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins: ${CORS_ALLOWED_ORIGINS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

app:
  gateway:
    secret-enabled: true
    shared-secret: ${GATEWAY_SHARED_SECRET}
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:1}

logging:
  structured:
    format:
      console: ecs
  level:
    root: WARN
    com.globalrfq.gateway: INFO
