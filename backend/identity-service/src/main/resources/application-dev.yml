logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  level:
    root: INFO
    com.globalrfq.identity: DEBUG

app:
  gateway:
    secret-enabled: ${GATEWAY_SECRET_ENABLED:true}
  notification:
    log-sensitive-in-mock: true
    outbox-encryption-key: ${OUTBOX_ENCRYPTION_KEY:dev-only-identity-notification-key-rotate-before-use}
